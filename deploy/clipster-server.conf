# Default: 127.0.0.1:8743 (localhost only)
# Use 0.0.0.0 to listen on all interfaces (requires api_key)
bind = "0.0.0.0:8743"
db_path = "/var/lib/clipster/clipster.db"
image_dir = "/var/lib/clipster/images"
# api_key = "your-secret-key-here"

# Auto-delete non-favorite clips older than N days. 0 = keep forever.
# retention_days = 30
